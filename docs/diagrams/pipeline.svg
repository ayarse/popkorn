<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" width="720" height="604" class="pkd" role="img" aria-labelledby="pkd-pipeline-title">
  <title id="pkd-pipeline-title">Popkorn pipeline: sources convert to a scene file, which the parser and player turn into frames on Canvas2D, SVG or Skia</title>
  <style>
    .pkd { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pkd .box { fill: #f6f7fb; stroke: #d3d7e5; stroke-width: 1; }
    .pkd .group { fill: none; stroke: #7479d6; stroke-width: 1.25; }
    .pkd .key { fill: #eef0ff; stroke: #7479d6; stroke-width: 1.25; }
    .pkd .t { fill: #1f2330; font-size: 13px; font-weight: 600; }
    .pkd .s { fill: #5d6477; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pkd .label { fill: #7479d6; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .pkd .wire { fill: none; stroke: #8a90a6; stroke-width: 1.25; }
    .pkd .dash { stroke-dasharray: 4 3; }
    .pkd .head { fill: #8a90a6; }
    @media (prefers-color-scheme: dark) {
      .pkd .box { fill: #1c1f2e; stroke: #353a50; }
      .pkd .key { fill: #23264a; stroke: #8b8ff0; }
      .pkd .group { stroke: #8b8ff0; }
      .pkd .t { fill: #e6e8f0; }
      .pkd .s { fill: #9aa0b5; }
      .pkd .label { fill: #8b8ff0; }
      .pkd .wire { stroke: #6b7086; }
      .pkd .head { fill: #6b7086; }
    }
  </style>
  <defs>
    <marker id="pkd-pipeline-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <!-- Sources -->
  <rect class="box" x="40" y="20" width="190" height="44" rx="8"/>
  <text class="t" x="135" y="47" text-anchor="middle">Lottie JSON</text>
  <rect class="box" x="265" y="20" width="190" height="44" rx="8"/>
  <text class="t" x="360" y="47" text-anchor="middle">SVG</text>
  <rect class="box" x="490" y="20" width="190" height="44" rx="8"/>
  <text class="t" x="585" y="47" text-anchor="middle">Written by hand or an LLM</text>

  <!-- Converters -->
  <path class="wire" d="M135 64 V104" marker-end="url(#pkd-pipeline-arrow)"/>
  <path class="wire" d="M360 64 V104" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="40" y="104" width="415" height="56" rx="8"/>
  <text class="t" x="247.5" y="127" text-anchor="middle">@popkorn/converters</text>
  <text class="s" x="247.5" y="146" text-anchor="middle">lottie2popkorn · svg2popkorn</text>

  <!-- Scene file -->
  <path class="wire" d="M300 160 V200" marker-end="url(#pkd-pipeline-arrow)"/>
  <path class="wire" d="M585 64 V222 H530" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="key" x="190" y="200" width="340" height="44" rx="8"/>
  <text class="t" x="360" y="227" text-anchor="middle">Popkorn scene (.css)</text>

  <!-- Exports -->
  <path class="wire dash" d="M190 222 H152" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="20" y="194" width="132" height="56" rx="8"/>
  <text class="t" x="86" y="217" text-anchor="middle">Exports</text>
  <text class="s" x="86" y="236" text-anchor="middle">Lottie · GIF · MP4</text>

  <!-- Parser -->
  <path class="wire" d="M360 244 V284" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="190" y="284" width="340" height="56" rx="8"/>
  <text class="t" x="360" y="307" text-anchor="middle">@popkorn/parser</text>
  <text class="s" x="360" y="326" text-anchor="middle">parse(source) → typed AST · zero deps</text>

  <!-- Player -->
  <path class="wire" d="M360 340 V380" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="group" x="40" y="380" width="640" height="124" rx="10"/>
  <text class="label" x="58" y="402">@popkorn/player</text>
  <rect class="box" x="58" y="416" width="136" height="44" rx="6"/>
  <text class="s" x="126" y="442" text-anchor="middle">buildSceneGraph</text>
  <path class="wire" d="M194 438 H212" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="212" y="416" width="136" height="44" rx="6"/>
  <text class="s" x="280" y="442" text-anchor="middle">scene tree</text>
  <path class="wire" d="M348 438 H366" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="366" y="416" width="136" height="44" rx="6"/>
  <text class="s" x="434" y="442" text-anchor="middle">RenderLoop</text>
  <path class="wire" d="M502 438 H514" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="514" y="416" width="142" height="44" rx="6"/>
  <text class="s" x="585" y="442" text-anchor="middle">Renderer interface</text>
  <text class="s" x="360" y="488" text-anchor="middle">one global timeline · one shared render walk for every backend</text>

  <!-- Backends -->
  <path class="wire" d="M585 460 V524 H135 V548" marker-end="url(#pkd-pipeline-arrow)"/>
  <path class="wire" d="M360 524 V548" marker-end="url(#pkd-pipeline-arrow)"/>
  <path class="wire" d="M585 524 V548" marker-end="url(#pkd-pipeline-arrow)"/>
  <rect class="box" x="40" y="548" width="190" height="44" rx="8"/>
  <text class="t" x="135" y="575" text-anchor="middle">Canvas2D</text>
  <rect class="box" x="265" y="548" width="190" height="44" rx="8"/>
  <text class="t" x="360" y="575" text-anchor="middle">SVG</text>
  <rect class="box" x="490" y="548" width="190" height="44" rx="8"/>
  <text class="t" x="585" y="568" text-anchor="middle">Skia</text>
  <text class="s" x="585" y="584" text-anchor="middle">@popkorn/react-native</text>
</svg>
