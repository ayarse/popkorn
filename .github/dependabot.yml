version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

# No npm ecosystem on purpose. Dependabot rewrites the manifests but leaves
# bun.lock untouched in a workspace repo (dependabot-core#14223), so every PR
# lands broken under `bun install --frozen-lockfile`. Repo-level Dependabot
# security updates are separate and still on; fix the lockfile by hand there.
