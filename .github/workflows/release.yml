name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the Version Packages PR + git tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing (OIDC) — no long-lived token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # changeset publish shells out to `npm publish`; OIDC needs npm >= 11.5.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # With pending changesets: opens/updates a "Version Packages" PR (runs `version`).
      # On merge of that PR (no changesets left): runs `publish`.
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: "chore: update versions"
          commit: "chore: update versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only: npm uses OIDC when the package has a trusted
          # publisher configured. Delete the secret once all four are set up.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
