name: Deploy redirect stub to Pages

# The playground lives at usepopkorn.dev now. Pages stays enabled — disabling it
# would 404 every old link — and serves a two-file stub that forwards
# ayarse.github.io/popkorn/* (404.html catches the deep paths) to the new origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          mkdir -p stub
          cp .github/pages-stub/index.html stub/index.html
          cp .github/pages-stub/index.html stub/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: stub
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
