name: Deploy redirect stub to Pages

# The playground lives at usepopkorn.dev now. Pages stays enabled — disabling it
# would 404 every old link — and serves a two-file stub that forwards
# ayarse.github.io/popkorn/* (404.html catches the deep paths) to the new origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          mkdir -p stub
          cp .github/pages-stub/index.html stub/index.html
          cp .github/pages-stub/index.html stub/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: stub
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
