name: Deploy playground to Cloudflare Workers

# Needs a CLOUDFLARE_API_TOKEN repo secret (Workers Scripts:Edit + D1:Edit).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter @popkorn/playground build
      - run: bunx wrangler deploy
        working-directory: packages/playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
