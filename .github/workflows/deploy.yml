name: Deploy playground to Cloudflare Workers

# Needs a CLOUDFLARE_API_TOKEN repo secret (Workers Scripts:Edit + D1:Edit).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The Clerk publishable key is public but baked in at build time, so it
      # has to be present here, not just as a Worker secret.
      - run: bun --filter @popkorn/playground build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      - run: bunx wrangler deploy
        working-directory: packages/playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A token scoped to one account can't enumerate it, so wrangler needs
          # the id spelled out.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
